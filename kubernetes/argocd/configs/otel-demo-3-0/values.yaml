# Fully self-contained install of the 3.0 demo: its own collector, Jaeger,
# Prometheus, Grafana, and OpenSearch all stay on the chart's defaults.
# These two are off by default; enabling them lights up the full
# continuous-profiling path introduced in 3.0.
components:
  firepit:
    enabled: true

otel-ebpf-profiler:
  enabled: true

# The chart's default hostPorts collide with the cluster-wide otelcol
# DaemonSet, which already binds 4317/4318/6831/14268/14250/9411 on every
# node. Demo services reach this collector via its ClusterIP Service, not
# hostPort, so remap hostPort only to unblock DaemonSet scheduling.
opentelemetry-collector:
  ports:
    otlp:
      hostPort: 14317
    otlp-http:
      hostPort: 14318
    jaeger-compact:
      hostPort: 16831
    jaeger-thrift:
      hostPort: 24268
    jaeger-grpc:
      hostPort: 24250
    zipkin:
      hostPort: 19411

  # Dual-write into the homelab-wide OSS backends (same Mimir/Loki/Tempo the
  # otelcol namespace's collectors use) alongside this demo's bundled
  # Prometheus/OpenSearch/Jaeger. Only the exporters list per pipeline is
  # overridden here; everything else in the chart's default config (receivers,
  # processors) is left untouched by the merge.
  config:
    exporters:
      prometheusremotewrite:
        endpoint: "http://10.4.20.147:9009/api/v1/push"
        headers:
          X-Scope-OrgID: "anonymous"
        resource_to_telemetry_conversion:
          enabled: true
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: "http://10.4.20.147:3100/otlp"
        tls:
          insecure: true
      otlp/tempo:
        endpoint: "10.4.20.147:4317"
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          exporters:
            - otlp_http/prometheus
            - debug
            - prometheusremotewrite
        logs:
          exporters:
            - opensearch
            - debug
            - otlphttp/loki
        traces:
          exporters:
            - otlp_grpc/jaeger
            - debug
            - span_metrics
            - otlp/tempo

# Full Prometheus stack (sub-components are off by default in the chart).
# server.resources: the chart's 400Mi default limit isn't enough for this
# deployment's WAL replay + scrape load (node-exporter, kube-state-metrics,
# pushgateway, and the agent/tool/chatbot histograms), causing OOMKilled
# crash loops.
prometheus:
  server:
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1Gi
  alertmanager:
    enabled: true
  configmapReload:
    prometheus:
      enabled: true
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true
  prometheus-pushgateway:
    enabled: true
