# Send all telemetry to the existing otelcol-agent collector instead of the
# chart's bundled one — avoids duplicate host/cluster metrics and a second hop.
# Every component's default env resolves its OTLP endpoint from this var, so
# it's the only override needed (load-generator's own default env already
# wires K6's OTel output through it via HTTP, insecure, on :4318).
default:
  envOverrides:
    - name: OTEL_COLLECTOR_NAME
      value: otelcol-agent-opentelemetry-collector.otelcol.svc.cluster.local

# opentelemetry-collector and opensearch stay disabled: telemetry still lands
# in the homelab stack via otelcol-agent, and opensearch is unused. Prometheus,
# grafana, and jaeger are enabled to run as part of this demo's own stack.
opentelemetry-collector:
  enabled: false
jaeger:
  enabled: true
prometheus:
  enabled: true
  # n03's disk is under heavy I/O pressure, so TSDB WAL replay on startup
  # takes far longer than the default liveness probe's ~75s grace period —
  # prometheus was getting killed mid-replay and crash-looping forever.
  # Give it a real startup window, decoupled from steady-state liveness.
  server:
    startupProbe:
      enabled: true
      periodSeconds: 10
      failureThreshold: 60
      timeoutSeconds: 10
grafana:
  enabled: true
opensearch:
  enabled: false

# The chart's default load-generator image (grafana/k6-with-browser based)
# now bundles Chromium and enables the browser scenario out of the box, so
# the custom fork image is no longer needed. Its default 512Mi limit still
# isn't enough for k6 + a headless browser under load, so keep that bumped.
components:
  load-generator:
    resources:
      limits:
        memory: 1.5Gi
  # ad's default 300Mi limit is too tight under load-generator traffic and
  # was OOMKilling repeatedly (100+ restarts); give it more headroom.
  ad:
    resources:
      limits:
        memory: 450Mi
